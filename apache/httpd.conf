<VirtualHost *:80>
  RewriteEngine On

    <Directory /var/www/>
        # remove .php
        RewriteCond %{REQUEST_FILENAME}.php -f
        RewriteRule !.*\.php$ %{REQUEST_FILENAME}.php [QSA,L]
        <IfModule mod_headers.c>
            <FilesMatch ".(ttf|otf|eot|woff|woff2)$">
                Header set Access-Control-Allow-Origin "*"
            </FilesMatch>
        </IfModule>
    </Directory>
</VirtualHost>
